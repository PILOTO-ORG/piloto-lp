    <!--
      Preload do primeiro slide do Hero, que é o elemento LCP da home.

      Era um <script> que injetava o link depois de o HTML ser processado — tarde
      demais, porque o preload scanner do navegador já tinha passado. E apontava
      para /images/automation-hero.webp, que nenhum componente renderiza: baixava
      16 KB inúteis e ainda competia com a imagem que o Hero realmente mostra.

      Link estático para o scanner achar na primeira passada. O imagesrcset tem de
      repetir o do <img> do Hero, senão o navegador baixa as duas larguras.
    -->
    <link
      rel="preload"
      as="image"
      href="/images/hero/whatsapp-1600.webp"
      imagesrcset="/images/hero/whatsapp-800.webp 800w, /images/hero/whatsapp-1600.webp 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <title>Piloto - Viaje nessa experiência</title>
