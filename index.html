    <!--
      SEM preload de imagem aqui, de propósito.

      Havia um preload do primeiro slide do carrossel, que era o elemento LCP
      quando o carrossel abria a home. Em 09/10/2026 o herói virou TEXTO
      (src/components/HeroIntro.tsx) e o carrossel desceu para o meio da página:
      o LCP agora é o <h1>, que vem no HTML, e as imagens do carrossel estão
      abaixo da dobra com loading="lazy".

      Preload de imagem que não é mais o LCP não acelera nada — só antecipa um
      download de 1600px que disputa banda com o bundle. Se o herói voltar a ser
      imagem, o preload volta junto, com imagesrcset igual ao do <img>.
    -->

    <title>Piloto — a operação da sua empresa num app só, com IA que executa</title>

    <!-- Inlined critical CSS -->
    <style>
      /* Estilos críticos para evitar layout shifts */
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #111827;
        color: #F9FAFB;
      }
      
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      
      /* Esqueleto de carregamento */
      .loading-skeleton {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1F2937;
      }
    </style>

    <!--
      Dados estruturados da empresa.

      `legalName` é PILOTO LTDA sem o "- ME": ME é enquadramento, não parte do
      nome (1ª Alteração Contratual, JUCESC 26/01/2026). O endereço aqui é o
      OPERACIONAL, o mesmo que o rodapé mostra — a sede registrada em Biguaçu
      fica nos Termos e na Política de Privacidade, que é onde ela tem efeito.
      Os dois coexistem de propósito; não "unificar".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Piloto",
        "legalName": "PILOTO LTDA",
        "taxID": "59.537.121/0001-10",
        "url": "https://www.piloto.life/",
        "logo": "https://www.piloto.life/android-chrome-512x512.png",
        "email": "luan@piloto.life",
        "telephone": "+55-48-99858-9586",
        "description": "Automação de operações para médias empresas com agentes de IA integrados ao WhatsApp, desenvolvimento sob medida e licenciamento de programas de computador customizáveis.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rodovia Municipal Francisco Wollinger, 2037, Areias do Meio",
          "addressLocality": "Governador Celso Ramos",
          "addressRegion": "SC",
          "postalCode": "88196-192",
          "addressCountry": "BR"
        },
        "sameAs": ["https://www.instagram.com/piloto.life"]
      }
    </script>
